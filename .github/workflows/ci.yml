name: Krishi AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install Dependencies
      # --ignore-scripts avoids the heavy Chromium (puppeteer) / native (sharp) downloads
      run: npm install --no-audit --no-fund --ignore-scripts

    - name: Build Project
      run: npm run build
      env:
        # Read at build time by vite.config.ts `define` and injected into the
        # client bundle. Store the REAL values as GitHub Actions repository
        # secrets (Settings -> Secrets and variables -> Actions). The `|| 'dummy'`
        # keeps the build green on forks without secrets; AI features simply
        # won't work until the real keys are provided.
        API_KEY: ${{ secrets.API_KEY || 'build_dummy_key' }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'build_dummy_key' }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
        HF_TOKEN: ${{ secrets.HF_TOKEN || 'build_dummy_token' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL || '' }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'build_dummy_key' }}

    - name: Upload production build
      uses: actions/upload-artifact@v4
      with:
        name: krishi-ai-dist
        path: dist/
        if-no-files-found: error
